# Optional workflow: copy to .github/workflows/ci.yml to enable GitHub Actions.
# Uploading a workflow requires GitHub credentials with workflow-write permission.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[all]'
      - name: Install and verify external exchange
        run: python scripts/bootstrap_rtg.py
      - run: ruff check src tests scripts
      - name: Python tests without external services
        run: pytest -m 'not chain and not kafka and not network and not live' -ra
      - name: README quick start
        run: vigil simulate --session 2 --scenario rogues --match-id quickstart --no-regulatory

  integration:
    name: Kafka, exchange, and Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e '.[all]'
      - run: python scripts/bootstrap_rtg.py
      - run: bash scripts/bootstrap_tools.sh
      - run: bash scripts/kafka_local.sh start
      - name: Kafka, local chain, and live exchange tests
        env:
          VIGIL_TEST_LIVE: '1'
        run: pytest -m 'chain or kafka or live' -ra
      - name: Solidity tests and formatting
        working-directory: contracts
        run: |
          ../.tools/foundry/forge fmt --check
          ../.tools/foundry/forge test
      - name: Stop broker
        if: always()
        run: bash scripts/kafka_local.sh stop
